<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINKr</title>
    <meta name="description" content="Link page based on params">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            const mainContainer = document.getElementById('main-container');
            const theme_btn = document.getElementById("theme-btn");
            const selected_theme = document.getElementById("selected_theme");
            let themeState = localStorage.getItem('theme') || "auto";

            function day_mode() {
                body.classList.remove('dark');
                mainContainer.classList.add('bg-white', 'text-[#1f243d]');
                mainContainer.classList.remove('bg-[#1f243d]', 'text-white');
            }
            function night_mode() {
                body.classList.add('dark');
                mainContainer.classList.add('bg-[#1f243d]', 'text-white');
                mainContainer.classList.remove('bg-white', 'text-[#1f243d]');
            }

            function apply_theme_based_on_time() {
                const currentHour = new Date().getHours();
                currentHour >= 12 && currentHour < 18 ? day_mode() : night_mode();
            }

            function apply_theme(theme) {
                if (theme === "night") {
                    night_mode();
                    selected_theme.textContent = "night";
                    selected_theme.style.color = "#8f31ea";
                } else if (theme === "day") {
                    day_mode();
                    selected_theme.textContent = "day";
                    selected_theme.style.color = "#05ebad";
                } else {
                    apply_theme_based_on_time();
                    selected_theme.textContent = "auto";
                    selected_theme.style.color = "#477fdc";
                }
            }

            apply_theme(themeState);

            const prefixMap = {
                aws: "aws.amazon.com/",
                db: "dropbox.com/",
                dc: "discord.com/",
                fb: "facebook.com/",
                gd: "drive.google.com/",
                gh: "github.com/",
                gl: "gitlab.com/",
                ig: "instagram.com/",
                kck: "kick.com/",
                li: "linkedin.com/in/",
                ln: "linkedin.com/company/",
                pn: "pinterest.com/",
                rd: "reddit.com/",
                sc: "soundcloud.com/",
                sp: "spotify.com/",
                stm: "steamcommunity.com/id/",
                tg: "t.me/",
                tt: "tiktok.com/@",
                ttv: "twitch.tv/",
                tw: "twitter.com/",
                vsc: "vsco.co/",
                wb: "web.archive.org/web/",
                wkp: "wikipedia.org/wiki/",
                wp: "wordpress.com/",
                yt: "youtube.com/@",
            };


            function list_links() {
                const urlParams = new URLSearchParams(window.location.search);
                const linksParam = urlParams.get('l');

                if (linksParam) {
                    const links = linksParam.split(',');
                    const listContainer = document.createElement('ul');
                    listContainer.className = 'list-none p-0 h-full content-center backdrop-blur-sm';

                    links.forEach(link => {
                        const [prefix, ...rest] = link.split('/');
                        const restJoined = rest.join('/');
                        const base = prefixMap[prefix] || 'https://';
                        const fullLink = "https://" + base + restJoined;

                        const listItem = document.createElement('li');
                        const anchor = document.createElement('a');
                        anchor.href = fullLink;
                        anchor.rel = "noreferrer noopener";
                        anchor.textContent = fullLink.replace(/^https?:\/\//, '');
                        anchor.className = 'text-lg no-underline block my-2';

                        listItem.appendChild(anchor);
                        listContainer.appendChild(listItem);
                    });

                    const mainContainer = document.getElementById('main-container');
                    mainContainer.appendChild(listContainer);
                }
            }
            list_links();

            theme_btn.addEventListener('click', () => {
                if (themeState === "auto") {
                    themeState = "night";
                } else if (themeState === "night") {
                    themeState = "day";
                } else {
                    themeState = "auto";
                }

                localStorage.setItem('theme', themeState);

                apply_theme(themeState);
            });

            const help_btn = document.getElementById("help-btn");

            help_btn.addEventListener('click', () => {
                if(!mainContainer.classList.contains('help')) {
                    const mainContainer = document.getElementById('main-container');
                    mainContainer.classList.add('help');
                    mainContainer.innerHTML = '';

                    const listContainer = document.createElement('ul');
                    listContainer.className = 'list-none p-0 h-full content-center backdrop-blur-sm';

                    Object.entries(prefixMap).forEach(([prefix, url]) => {
                        const listItem = document.createElement('li');
                        listItem.textContent = `${prefix}: "${url}"`;
                        listItem.className = 'text-lg my-2';
                        listContainer.appendChild(listItem);
                    });

                    mainContainer.appendChild(listContainer);
                } else {
                    mainContainer.classList.remove('help');
                    mainContainer.innerHTML = '';
                    list_links();
                }
            });
        });
    </script>
</head>
<body class="bg-[#16161d] text-white font-mono m-0 p-0 grid grid-rows-[1fr_35px] grid-cols-[10px_1fr] h-dvh w-screen overflow-hidden select-none dark">
    <div class="side-palette row-span-1 col-span-1 h-full w-full flex flex-col">
        <div class="flex-1 bg-[#8f31ea] flex items-center">L</div>
        <div class="flex-1 bg-[#4b40f2] flex items-center">I</div>
        <div class="flex-1 bg-[#477fdc] flex items-center">N</div>
        <div class="flex-1 bg-[#4bd2f2] flex items-center">K</div>
        <div class="flex-1 bg-[#05ebad] flex items-center">r</div>
    </div>
    <main id="main-container" class="bg-[url('./background.svg')] bg-cover bg-center row-span-1 col-span-1 flex items-center justify-center overflow-y-auto">
    </main>
    <footer class="text-white text-center row-span-1 col-span-2 h-full w-full flex items-center justify-center">
        <button id="help-btn" class="absolute left-2">?</button>
        <strong>
            <> by <a class="bg-gradient-to-r from-[#8f31ea] via-[#4b40f2] via-[#477fdc] via-[#4bd2f2] to-[#05ebad] bg-clip-text text-transparent" href="https://github.com/WLLR9505" class="text-inherit">WLLR9505</a>
        </strong>
        <button id="theme-btn" class="absolute right-0">theme(<span id="selected_theme" class="text-[#477fdc]">auto</span>)</button>
    </footer>
</body>
</html>
